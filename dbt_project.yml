name: 'my_dbt_project'
version: '1.0.0'
config-version: 2

# This must match the profile name in profiles.yml
profile: 'my_dbt_project'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  my_dbt_project:
    staging:
      +materialized: view
    marts:
      +materialized: table
